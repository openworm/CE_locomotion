[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "worm2d"
version = "0.1.0"
description = "Configurable neuromechanical models of C. elegans locomotion"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Adam Ponzi"}]
dependencies = [
    "matplotlib>=3.6",
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
notebooks = ["ipython", "ipywidgets", "jupyter"]
neuroml = ["modelspec", "pyneuroml", "neuron>=8.2"]
test = ["pytest>=7", "ruff==0.16.0"]
build = ["build", "scikit-build-core>=0.10"]

[project.scripts]
worm2d = "worm2d.cli:main"

[tool.scikit-build]
cmake.build-type = "Release"
minimum-version = "build-system.requires"
build.tool-args = ["-j2"]
wheel.packages = ["src/worm2d"]
sdist.include = [
    "native/**",
    "legacy/CMakeLists.txt",
    "legacy/**/CMakeLists.txt",
    "legacy/**/Makefile",
    "legacy/**/makefile",
