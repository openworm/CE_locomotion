name: Worm2D package CI

on:
  push:
    branches: ["main", "test*", "package/**"]
  pull_request:
    branches: ["main", "test*", "package/**"]

jobs:
  package:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install native build dependency
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev

      - name: Install build and test tools
        run: python -m pip install build ruff==0.16.0

      - name: Lint Python package
        run: ruff check src/worm2d run_main.py helper_funcs.py load_data.py W2Djson_utils.py F2_fig_behavior.py

      - name: Test pip install
        run: pip install .



  main-osc-regression:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install regression dependencies and package
        run: |
          sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev
          python -m pip install . OSBModelValidation
          
      - name: Print info on installed packages and files
        run: |
          pip list
          ls -alth

      - name: Run main_osc regression
        run: omv test -V .test.W2D18.omt
