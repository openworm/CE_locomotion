name: Worm2D package CI

on:
  push:
    branches: ["main", "test*", "package/**"]
  pull_request:
    branches: ["main", "test*", "package/**"]

jobs:
  package:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install native build dependency
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev

      - name: Install build and test tools
        run: python -m pip install build pytest ruff==0.16.0

      - name: Lint Python package
        run: ruff check src/worm2d tests run_main.py helper_funcs.py load_data.py W2Djson_utils.py

      - name: Run unit tests
        run: pytest -q

      - name: Build source distribution and wheel
        run: python -m build

      - name: Inspect wheel contents
        run: |
          python -m zipfile -l dist/*.whl | grep 'worm2d/bin/main_osc'
          ! python -m zipfile -l dist/*.whl | grep -E 'worm2d/bin/main$|main.cpp'

      - name: Test installed wheel outside source tree
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          python -c "import worm2d; from worm2d.native import resolve_main_osc; print(worm2d.__version__, resolve_main_osc())"

  main-osc-regression:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install regression dependencies and package
        run: |
          sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev
          python -m pip install . OSBModelValidation

      - name: Run main_osc regression
        run: omv test -V .test.W2D18.omt
