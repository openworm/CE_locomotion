name: Worm2D package CI

on:
  push:
    branches: ["master", "development", "test*", "package/**"]
  pull_request:
    branches: ["master", "development", "test*", "package/**"]

jobs:
  package:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-22.04, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]  # Note: 3.14 causes issues with Neuron 8.2.7

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install graphviz
        uses: ts-graphviz/setup-graphviz@v2
        with:
          # Skip to run brew update command on macOS.
          macos-skip-brew-update: 'true' # default false

      - name: Install native build dependencies (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev cmake tree graphviz openjdk-11-jdk 
        if: ${{ contains(matrix.runs-on, 'ubuntu') }}

      - name: Install native build dependencies (macOS)
        run: brew install nlohmann-json cmake tree
        if: ${{ contains(matrix.runs-on, 'macos') }}

      - name: C++ info
        run: g++ -v

      - name: Install lint and test tools
        run: python -m pip install ruff==0.16.0 OSBModelValidation

      - name: Lint Python package
        run: ruff check src/worm2d run_main.py helper_funcs.py load_data.py W2Djson_utils.py F2_fig_behavior.py

      - name: Build and install worm2d package (with C++ binaries)
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: pip install .[all] -v

      - name: Run test_all.sh
        run: ./test_all.sh

      - name: List generated files
        if: always()
        run: |
          ls -alth
          tree -L 2 testruns || true
          pip list
